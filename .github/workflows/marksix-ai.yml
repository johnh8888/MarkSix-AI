name: 六合AI最终测试


on:

  workflow_dispatch:


permissions:

  contents: write



jobs:


  run:


    runs-on: ubuntu-latest


    env:

      PYTHONPATH: ${{ github.workspace }}

      PYTHONIOENCODING: utf-8

      LANG: C.UTF-8

      LC_ALL: C.UTF-8



    steps:


    - name: 拉取代码

      uses: actions/checkout@v4



    - name: Python环境

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 安装依赖

      run:

        pip install -r requirements.txt || true



    - name: 查看环境

      run: |

        python --version

        pwd

        ls



    - name: 测试核心模块

      run: |

        python - <<'PY'

        import core

        print("核心模块加载成功")

        PY



    - name: 运行六合AI

      run:

        python -u main.py



    - name: 输出最终预测

      run: |


        echo "=============================="

        echo "        六合AI最终预测"

        echo "=============================="


        python - <<'PY'


        import json


        path="output/prediction.json"



        with open(

            path,

            encoding="utf-8"

        ) as f:

            data=json.load(f)



        print()

        print("版本:",data.get("version"))

        print("时间:",data.get("time"))



        for key,item in data.get("lotteries",{}).items():


            print()

            print("==============================")

            print(

                item.get(

                    "彩种",

                    key

                )

            )

            print("==============================")


            if "error" in item:

                print(

                    "错误:",

                    item["error"]

                )

                continue



            p=item.get(

                "预测",

                {}

            )



            # 兼容 V7/V8/V9

            state=p.get(

                "市场状态",

                {}

            )



            状态=(

                state.get("状态")

                or

                state.get("state")

                or

                "未知"

            )



            print(

                "市场状态:",

                状态

            )



            if "entropy" in state:

                print(

                    "熵值:",

                    state["entropy"]

                )



            print(

                "特码10码:",

                p.get(

                    "特码10码",

                    []

                )

            )


            print(

                "重点3码:",

                p.get(

                    "重点3码",

                    []

                )

            )


            print(

                "第一推荐:",

                p.get(

                    "第一推荐"

                )

            )


            print(

                "评分:",

                p.get(

                    "评分",

                    {}

                )

            )



            属性=p.get(

                "属性",

                {}

            )


            if 属性:

                print(

                    "属性:",

                    属性

                )



        PY
