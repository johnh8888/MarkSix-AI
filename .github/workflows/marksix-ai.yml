name: 六合AI V3.3 FINAL

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


jobs:
  run:

    runs-on: ubuntu-latest


    steps:

      - name: 拉取项目代码
        uses: actions/checkout@v4


      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      - name: 检查配置
        run: |
          python - <<'PY'
          import config

          print("版本:", config.VERSION)

          assert config.VERSION == "V3.3 FINAL"

          print("配置正常")
          PY


      - name: 运行 AI
        run: |
          python -u main.py


      - name: 查看预测结果
        run: |
          echo "=============================="
          echo "AI预测结果"
          echo "=============================="

          cat output/prediction.json


      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: marksix-ai-v3.3-result
          path: |
            output/prediction.json
            data/marksix_v3.db
