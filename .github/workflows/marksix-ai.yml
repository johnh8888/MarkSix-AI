name: 六合AI V10 FINAL


on:

  workflow_dispatch:


permissions:

  contents: write



jobs:


  run:


    runs-on:

      ubuntu-latest



    steps:


    - name:

        拉取代码

      uses:

        actions/checkout@v4



    - name:

        Python

      uses:

        actions/setup-python@v5

      with:

        python-version: "3.11"



    - name:

        设置中文环境

      run:

        |

        echo "LANG=zh_CN.UTF-8" >> $GITHUB_ENV

        echo "LC_ALL=zh_CN.UTF-8" >> $GITHUB_ENV

        echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV



    - name:

        安装依赖

      run:

        |

        pip install requests pandas numpy



    - name:

        运行AI

      env:

        PYTHONPATH:

          ${{github.workspace}}

      run:

        |

        python -u main.py



    - name:

        最终预测

      run:

        |

        python - <<'PY'

        import json


        d=json.load(
          open(
          "output/prediction.json",
          encoding="utf-8"
          )
        )


        print("="*40)

        print("       六合AI V10最终预测")

        print("="*40)


        for k,v in d["lotteries"].items():

            print()

            print(v.get("彩种",k))

            print("-"*30)


            p=v.get("预测",{})


            print(
            "特码10码:",
            p.get("特码10码")
            )


            print(
            "重点3码:",
            p.get("重点3码")
            )


            print(
            "第一推荐:",
            p.get("第一推荐")
            )


            print(
            "生肖5肖:",
            p.get("生肖5肖")
            )


            print(
            "属性:",
            p.get("属性")
            )


        PY
