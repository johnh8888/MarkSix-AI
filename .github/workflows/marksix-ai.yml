      # ==================================================
      # 调试历史API
      # ==================================================

      - name: 调试历史API返回
        run: |

          python - <<'PY'

          import requests
          import urllib3


          urllib3.disable_warnings()


          url = "https://marksix6.net/index.php?api=1"


          response = requests.get(
              url,
              verify=False,
              timeout=20,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )


          print("==============================")
          print("HTTP状态:", response.status_code)
          print("==============================")


          print(
              response.text[:5000]
          )


          PY
