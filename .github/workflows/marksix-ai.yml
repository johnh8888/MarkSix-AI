name: 六合AI测试


on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  test:

    runs-on: ubuntu-latest


    steps:


    - name: 拉取代码
      uses: actions/checkout@v4


    - name: Python环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: 查看目录
      run: |

        pwd

        ls

        echo "------"

        find . -maxdepth 2 -type f


    - name: 测试Python
      env:
        PYTHONPATH: ${{ github.workspace }}

      run: |

        python - <<'PY'

        import os

        print("当前目录:")
        print(os.getcwd())


        import core

        print("core导入成功")


        PY


    - name: 运行系统

      env:
        PYTHONPATH: ${{ github.workspace }}

      run:

        python -u main.py
