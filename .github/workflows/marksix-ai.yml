name: MarkSix AI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 拉取代码
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. Python版本
      # ======================================================

      - name: Python version
        run: |
          python --version


      # ======================================================
      # 4. 检查 main.py
      # ======================================================

      - name: Check project
        run: |
          test -f main.py
          test -f core/engine.py

          echo "项目文件正常"


      # ======================================================
      # 5. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install \
            --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install \
              -r requirements.txt
          fi


      # ======================================================
      # 6. Python语法检查
      # ======================================================

      - name: Compile
        run: |

          python -m compileall -q .

          echo "Python语法正常"


      # ======================================================
      # 7. 创建目录
      # ======================================================

      - name: Prepare directories
        run: |

          mkdir -p data
          mkdir -p output

          echo "目录准备完成"


      # ======================================================
      # 8. 运行系统
      # ======================================================

      - name: Run prediction
        run: |

          python -u main.py


      # ======================================================
      # 9. 检查输出文件
      #
      # 不再使用旧版 jq 条件。
      # 直接使用 Python 检查 JSON。
      # ======================================================

      - name: Check prediction results
        run: |

          echo "=============================="
          echo "检查预测结果"
          echo "=============================="

          test -f output/prediction.json
          test -f output/backtest.json
          test -f output/module_performance.json

          python - <<'PY'

          import json
          import os
          import sys


          files = [

              "output/prediction.json",

              "output/backtest.json",

              "output/module_performance.json",
          ]


          print("")
          print("检查JSON文件")
          print("")


          for path in files:

              print(f"检查：{path}")

              if not os.path.isfile(path):

                  print(
                      f"❌ 文件不存在：{path}"
                  )

                  sys.exit(1)


              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                  ) as f:

                      data = json.load(f)


              except Exception as exc:

                  print(
                      f"❌ JSON解析失败："
                      f"{exc}"
                  )

                  sys.exit(1)


              if not isinstance(
                  data,
                  dict,
              ):

                  print(
                      "❌ JSON顶层必须是object"
                  )

                  sys.exit(1)


              print("✅ JSON正常")


          # ==================================================
          # prediction.json
          # ==================================================

          with open(
              "output/prediction.json",
              "r",
              encoding="utf-8",
          ) as f:

              prediction = json.load(f)


          if "lotteries" not in prediction:

              print(
                  "❌ prediction.json缺少lotteries"
              )

              sys.exit(1)


          lotteries = prediction[
              "lotteries"
          ]


          if not isinstance(
              lotteries,
              dict,
          ):

              print(
                  "❌ lotteries必须是object"
              )

              sys.exit(1)


          required = [

              "新澳门彩",

              "老澳门彩",

              "香港彩",
          ]


          print("")
          print("检查三彩种")
          print("")


          for lottery in required:

              if lottery not in lotteries:

                  print(
                      f"❌ 缺少：{lottery}"
                  )

                  sys.exit(1)


              item = lotteries[
                  lottery
              ]


              if not isinstance(
                  item,
                  dict,
              ):

                  print(
                      f"❌ {lottery}"
                      "数据结构错误"
                  )

                  sys.exit(1)


              if "candidates" not in item:

                  print(
                      f"❌ {lottery}"
                      "缺少candidates"
                  )

                  sys.exit(1)


              print(
                  f"✅ {lottery}"
              )


          print("")
          print("==============================")
          print("预测结果检查通过")
          print("==============================")

          PY


      # ======================================================
      # 10. 输出文件
      # ======================================================

      - name: Show output
        run: |

          echo "=============================="
          echo "最终输出文件"
          echo "=============================="

          ls -lah output/

          echo ""
          echo "=============================="
          echo "prediction.json"
          echo "=============================="

          cat output/prediction.json

          echo ""
          echo "=============================="
          echo "全部检查通过"
          echo "=============================="


      # ======================================================
      # 11. 上传结果
      # ======================================================

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:

          name: marksix-ai-output

          path: |
            output/prediction.json
            output/backtest.json
            output/module_performance.json
            data/*.db

          if-no-files-found: error
