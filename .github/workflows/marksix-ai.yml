name: 六合AI V4.0 FINAL


on:

  workflow_dispatch:


  schedule:

    - cron: "0 */6 * * *"



jobs:


  run:


    runs-on: ubuntu-latest



    steps:


      -
        name: 拉取代码
        uses: actions/checkout@v4



      -
        name: 设置Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      -
        name: 安装依赖

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          fi



      -
        name: 设置环境

        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV



      -
        name: 检查Python

        run: |

          python --version



      -
        name: 检查目录

        run: |

          test -f main.py

          test -f config.py

          test -f core/engine.py

          test -f core/predictor.py

          test -f core/report.py

          echo "目录正常"



      -
        name: Python语法检查

        run: |

          python -m compileall -q .

          echo "语法正常"



      -
        name: 模块测试

        run: |

          python - <<'PY'

          import core

          import core.engine

          import core.predictor

          import core.report

          print("模块加载成功")

          PY



      -
        name: 初始化运行AI

        run: |

          python -u main.py



      -
        name: 检查输出

        run: |


          echo "=============================="

          echo "检查预测结果"

          echo "=============================="


          test -f output/prediction.json

          test -f output/report.txt



          python - <<'PY'


          import json


          from pathlib import Path



          file=Path(

              "output/prediction.json"

          )



          data=json.loads(

              file.read_text(

                  encoding="utf-8"

              )

          )



          print(

              "版本:",

              data.get("版本")

          )


          print(

              "系统:",

              data.get("系统")

          )



          assert "预测" in data



          print("JSON正常")



          PY




      -
        name: 上传AI结果

        uses: actions/upload-artifact@v4


        with:


          name: marksix-ai-v4-result


          path: |


            output/prediction.json

            output/report.txt

            data/*.db


          if-no-files-found: warn





      -
        name: 完成


        run: |


          echo ""

          echo "================================"

          echo " 六合AI V4.0 FINAL "

          echo "================================"

          echo ""

          echo "✅ API同步"

          echo "✅ 数据库"

          echo "✅ AI预测"

          echo "✅ 报告生成"

          echo "✅ 输出完成"

          echo ""
