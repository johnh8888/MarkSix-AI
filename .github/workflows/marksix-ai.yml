name: 六合AI V3.3 FINAL


on:

  workflow_dispatch:

  schedule:

    - cron: "0 */6 * * *"





jobs:


  run:


    runs-on: ubuntu-latest



    steps:



      # ==================================================
      # 1. 拉取代码
      # ==================================================

      - name: 拉取项目代码

        uses: actions/checkout@v4





      # ==================================================
      # 2. Python环境
      # ==================================================

      - name: 设置Python 3.11

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"





      # ==================================================
      # 3. 安装依赖
      # ==================================================

      - name: 安装依赖

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          fi





      # ==================================================
      # 4. 设置路径
      # ==================================================

      - name: 设置PYTHONPATH

        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

          python --version

          pwd





      # ==================================================
      # 5. 项目检查
      # ==================================================

      - name: 检查项目结构

        run: |


          test -f main.py

          test -f config.py


          test -f core/api_sync.py

          test -f core/database.py

          test -f core/engine.py

          test -f core/predictor.py


          echo "项目结构正常"





      # ==================================================
      # 6. Python语法
      # ==================================================

      - name: Python语法检查

        run: |


          python -m compileall -q .

          echo "语法正常"





      # ==================================================
      # 7. 模块检查
      # ==================================================

      - name: 核心模块检查

        run: |


          python - <<'PY'


          import core

          import core.api_sync

          import core.database

          import core.engine

          import core.predictor


          print("所有模块导入成功")


          PY





      # ==================================================
      # 8. 数据库初始化
      # ==================================================

      - name: 初始化数据库

        run: |


          python - <<'PY'


          from core.database import init_database


          init_database()


          print("数据库完成")


          PY





      # ==================================================
      # 9. 调试历史API
      # ==================================================

      - name: 调试历史API返回

        run: |


          python - <<'PY'


          import requests

          import urllib3



          urllib3.disable_warnings()



          url = "https://marksix6.net/index.php?api=1"



          r=requests.get(

              url,

              verify=False,

              timeout=20,

              headers={

                  "User-Agent":

                  "Mozilla/5.0"

              }

          )



          print("==============================")

          print(

              "状态:",

              r.status_code

          )

          print("==============================")


          print(

              r.text[:5000]

          )


          PY





      # ==================================================
      # 10. API同步
      # ==================================================

      - name: 同步在线数据

        run: |


          echo "================================"

          echo "开始API同步"

          echo "================================"



          python - <<'PY'


          from core.api_sync import sync_all



          result=sync_all()



          print()

          print("同步结果:")

          print(result)



          PY





      # ==================================================
      # 11. 运行AI
      # ==================================================

      - name: 运行六合AI V3.3 FINAL

        run: |


          echo "================================"

          echo "运行六合AI V3.3 FINAL"

          echo "================================"


          python -u main.py





      # ==================================================
      # 12. 检查预测文件
      # ==================================================

      - name: 检查预测结果

        run: |


          test -f output/prediction.json



          python - <<'PY'


          import json


          with open(

              "output/prediction.json",

              encoding="utf-8"

          ) as f:


              data=json.load(f)



          print("==============================")

          print("版本:")

          print(data.get("版本"))


          print("==============================")

          print("预测彩种:")


          for x in data.get(

              "预测",

              {}

          ):

              print(x)



          print("==============================")

          print("预测文件正常")


          PY





      # ==================================================
      # 13. 上传结果
      # ==================================================

      - name: 保存预测结果

        uses: actions/upload-artifact@v4

        with:


          name: marksix-ai-v3-result


          path: |


            output/prediction.json

            data/marksix_v3.db





      # ==================================================
      # 14. 完成
      # ==================================================

      - name: 完成

        run: |


          echo ""

          echo "================================"

          echo "六合AI V3.3 FINAL完成"

          echo "================================"
