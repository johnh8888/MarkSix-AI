name: 智能预测系统 V8.3.2

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"



jobs:

  predict:


    runs-on: ubuntu-latest


    steps:


      # ==============================
      # 拉取代码
      # ==============================

      - name: 拉取代码
        uses: actions/checkout@v4



      # ==============================
      # Python环境
      # ==============================

      - name: 设置Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # ==============================
      # 安装依赖
      # ==============================

      - name: 安装依赖

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          fi



      # ==============================
      # 基础检查
      # ==============================

      - name: 检查项目

        run: |

          echo "=============================="

          echo "检查项目文件"

          echo "=============================="


          test -f main.py


          mkdir -p data

          mkdir -p output


          python --version




      # ==============================
      # Python语法
      # ==============================

      - name: Python语法检查

        run: |

          python -m compileall -q .


          echo "语法正常"




      # ==============================
      # 清理旧输出
      # 注意：
      # 不删除数据库
      # ==============================

      - name: 清理旧结果

        run: |

          echo "清理旧预测文件"


          rm -f output/prediction.json

          rm -f output/backtest.json

          rm -f output/module_performance.json



      # ==============================
      # 运行系统
      # ==============================

      - name: 开始预测

        run: |


          echo "=============================="

          echo "开始运行六合智能预测系统"

          echo "=============================="


          python main.py





      # ==============================
      # 检查数据库
      # ==============================

      - name: 检查数据库

        run: |


          echo "=============================="

          echo "数据库检查"

          echo "=============================="


          ls -lah data





      # ==============================
      # 历史数量检查
      # ==============================

      - name: 检查历史期数

        run: |


          python - <<'PY'


          import sqlite3



          dbs={


          "新澳门彩":
          "data/new_macau.db",


          "老澳门彩":
          "data/old_macau.db",


          "香港彩":
          "data/hk.db"


          }



          print()

          print("="*60)

          print("历史数据检查")

          print("="*60)



          for name,path in dbs.items():


              conn=sqlite3.connect(path)


              count=conn.execute(

              "select count(*) from draws"

              ).fetchone()[0]


              conn.close()



              print(

              "✅",

              name,

              count,

              "期"

              )



              if count < 30:


                  raise Exception(

                  name+"历史不足30期"

                  )



          print("="*60)

          print("历史检查通过")

          print("="*60)



          PY





      # ==============================
      # 检查输出
      # ==============================

      - name: 检查预测文件

        run: |


          test -f output/prediction.json


          echo "预测文件正常"





      # ==============================
      # 中文预测摘要
      # ==============================

      - name: 输出预测结果

        run: |


          python - <<'PY'


          import json



          with open(

          "output/prediction.json",

          encoding="utf-8"

          ) as f:


              data=json.load(f)




          print()

          print("="*70)

          print("六合彩预测结果")

          print("="*70)




          for name,item in data["lotteries"].items():



              if not item.get("success"):

                  continue



              print()

              print("【"+name+"】")

              print("-"*50)



              print(

              "历史:",

              item["history_size"],

              "期"

              )



              print(

              "最新开奖:",

              " ".join(

              f"{x:02d}"

              for x in item["latest_numbers"]

              )

              )



              print(

              "预测期:",

              item["prediction_issue"]

              )



              print()

              print(

              "推荐10码:",

              " ".join(

              f"{x:02d}"

              for x in item["top10"]

              )

              )




              attr=item["attributes"]



              print(

              "生肖:",

              " ".join(

              attr["zodiac"]["top5"]

              )

              )



              print(

              "波色:",

              " ".join(

              attr["wave"]["rank"]

              )

              )



              print(

              "大小:",

              " ".join(

              attr["size"]["rank"]

              )

              )



              print(

              "单双:",

              " ".join(

              attr["odd_even"]["rank"]

              )

              )




              print()

              print("回测:")



              for k,v in item["backtest"].items():


                  print(

                  k+"期:",

                  v["hit_rate"],

                  "%"

                  )





          print()

          print("="*70)

          print("运行完成")

          print("="*70)



          PY
