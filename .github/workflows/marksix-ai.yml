name: 智能预测系统 V8.3.2


on:

  workflow_dispatch:

  schedule:

    - cron: "*/30 * * * *"



jobs:


  predict:


    runs-on: ubuntu-latest



    steps:



      # ==============================
      # 拉取代码
      # ==============================

      - name: 拉取代码

        uses: actions/checkout@v4




      # ==============================
      # Python环境
      # ==============================

      - name: 设置Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      # ==============================
      # 安装依赖
      # ==============================

      - name: 安装依赖

        run: |


          python -m pip install --upgrade pip


          if [ -f requirements.txt ]; then

              pip install -r requirements.txt

          fi




      # ==============================
      # 项目检查
      # ==============================

      - name: 检查项目

        run: |


          echo "=============================="

          echo "检查项目"

          echo "=============================="


          test -f main.py


          mkdir -p data

          mkdir -p output



          python --version





      # ==============================
      # 语法检查
      # ==============================

      - name: Python语法检查

        run: |


          python -m compileall -q .


          echo "语法正常"





      # ==============================
      # 清理旧输出
      # 不删除数据库
      # ==============================

      - name: 清理旧预测

        run: |


          echo "清理旧输出"


          rm -f output/prediction.json

          rm -f output/backtest.json

          rm -f output/module_performance.json





      # ==============================
      # 运行预测
      # ==============================

      - name: 运行六合预测系统

        run: |


          echo "=============================="

          echo "开始运行六合智能预测系统"

          echo "=============================="


          python main.py






      # ==============================
      # 数据库检查
      # ==============================

      - name: 检查数据库文件

        run: |


          echo "=============================="

          echo "数据库文件"

          echo "=============================="


          ls -lah data





      # ==============================
      # 历史检查
      # ==============================

      - name: 检查历史数据

        run: |


          python - <<'PY'


          import sqlite3

          from pathlib import Path



          databases={


              "新澳门彩":
              "data/new_macau.db",


              "老澳门彩":
              "data/old_macau.db",


              "香港彩":
              "data/hk.db"

          }




          print("="*60)

          print("历史数据检查")

          print("="*60)




          for name,path in databases.items():


              if not Path(path).exists():

                  raise Exception(

                      name+"数据库不存在"

                  )



              conn=sqlite3.connect(path)



              try:


                  count=conn.execute(

                      "SELECT COUNT(*) FROM history"

                  ).fetchone()[0]



              except Exception as e:


                  conn.close()


                  raise Exception(

                      name+"数据库结构错误:"+str(e)

                  )



              conn.close()



              print(

                  "✅",

                  name,

                  "历史",

                  count,

                  "期"

              )



              if count < 30:


                  raise Exception(

                      name+"历史不足30期"

                  )





          print("="*60)

          print("历史检查通过")

          print("="*60)



          PY






      # ==============================
      # 输出文件检查
      # ==============================

      - name: 检查预测文件

        run: |


          echo "检查输出"


          test -f output/prediction.json


          echo "预测文件正常"






      # ==============================
      # 中文显示预测
      # ==============================

      - name: 显示预测结果

        run: |


          python - <<'PY'


          import json



          with open(

              "output/prediction.json",

              encoding="utf-8"

          ) as f:


              data=json.load(f)





          print()

          print("="*70)

          print("六合彩预测结果")

          print("="*70)




          for name,item in data["lotteries"].items():



              if not item.get("success"):

                  continue



              print()

              print("【"+name+"】")

              print("-"*50)



              print(

                  "历史:",

                  item["history_size"],

                  "期"

              )



              print(

                  "最新开奖:",

                  " ".join(

                      f"{x:02d}"

                      for x in item["latest_numbers"]

                  )

              )



              print(

                  "预测期:",

                  item["prediction_issue"]

              )



              print()

              print(

                  "推荐10码:",

                  " ".join(

                      f"{x:02d}"

                      for x in item["top10"]

                  )

              )



              attr=item.get(

                  "attributes",

                  {}

              )



              print(

                  "生肖:",

                  " ".join(

                      attr.get(

                          "zodiac",

                          {}

                      ).get(

                          "top5",

                          []

                      )

                  )

              )



              print(

                  "波色:",

                  " ".join(

                      attr.get(

                          "wave",

                          {}

                      ).get(

                          "rank",

                          []

                      )

                  )

              )



              print(

                  "大小:",

                  " ".join(

                      attr.get(

                          "size",

                          {}

                      ).get(

                          "rank",

                          []

                      )

                  )

              )



              print(

                  "单双:",

                  " ".join(

                      attr.get(

                          "odd_even",

                          {}

                      ).get(

                          "rank",

                          []

                      )

                  )

              )



              print()

              print("回测:")



              for k,v in item.get(

                  "backtest",

                  {}

              ).items():


                  print(

                      k+"期:",

                      v.get(

                          "hit_rate",

                          0

                      ),

                      "%"

                  )





          print()

          print("="*70)

          print("预测完成")

          print("="*70)



          PY
