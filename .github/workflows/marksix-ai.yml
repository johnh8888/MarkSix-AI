name: 六合AI V3.3 FINAL


on:

  workflow_dispatch:


  schedule:

    # 每6小时运行

    - cron: "0 */6 * * *"





jobs:


  run:


    runs-on:

      ubuntu-latest




    steps:



      # ==================================================
      # 1. 拉取代码
      # ==================================================


      - name:

          拉取项目代码

        uses:

          actions/checkout@v4






      # ==================================================
      # 2. Python
      # ==================================================


      - name:

          设置Python环境

        uses:

          actions/setup-python@v5


        with:

          python-version:

            "3.11"







      # ==================================================
      # 3. 安装依赖
      # ==================================================


      - name:

          安装依赖

        run:


          python -m pip install --upgrade pip


          if [ -f requirements.txt ];

          then

              pip install -r requirements.txt

          fi








      # ==================================================
      # 4. 环境检查
      # ==================================================


      - name:

          环境检查

        run:


          echo "================================"

          python --version

          echo "路径:"

          pwd

          echo "================================"








      # ==================================================
      # 5. 项目结构
      # ==================================================


      - name:

          检查项目结构

        run:


          test -f main.py

          test -f config.py


          test -f core/__init__.py

          test -f core/database.py

          test -f core/api_sync.py

          test -f core/predictor.py

          test -f core/engine.py

          test -f core/wave.py

          test -f core/markov.py

          test -f core/hmm.py

          test -f core/zodiac.py



          echo "项目结构正常"








      # ==================================================
      # 6. Python语法
      # ==================================================


      - name:

          Python语法检查

        run:


          python -m compileall -q .



          echo "语法正常"








      # ==================================================
      # 7. 模块检查
      # ==================================================


      - name:

          核心模块检查

        run:


          python - <<'PY'


          import core


          import core.database

          import core.engine

          import core.predictor

          import core.wave

          import core.markov

          import core.hmm

          import core.zodiac



          print("===================")

          print("所有模块加载成功")

          print("===================")


          PY







      # ==================================================
      # 8. 配置检查
      # ==================================================


      - name:

          系统配置检查

        run:


          python - <<'PY'


          import config


          print("===================")

          print("版本:",config.VERSION)

          print("数据库:",config.DATABASE_FILE)

          print("输出:",config.OUTPUT_DIR)


          for k,v in config.LOTTERIES.items():

              print(
                  k,
                  "=",
                  v
              )


          assert config.VERSION=="V3.3 FINAL"


          print("===================")

          print("配置正常")


          PY







      # ==================================================
      # 9. 数据库初始化
      # ==================================================


      - name:

          初始化数据库

        run:


          python - <<'PY'


          from core.database import init_database


          init_database()


          print(

              "SQLite初始化完成"

          )


          PY








      # ==================================================
      # 10. API同步
      # ==================================================


      - name:

          API同步

        run:


          python - <<'PY'


          from core.api_sync import sync_all


          result=sync_all()


          print()

          print("===================")

          print("同步结果")

          print("===================")

          print(result)



          PY








      # ==================================================
      # 11. AI运行
      # ==================================================


      - name:

          运行六合AI V3.3

        run:


          python -u main.py








      # ==================================================
      # 12. 显示预测JSON
      # ==================================================


      - name:

          显示预测结果

        run:


          echo "================================"

          echo "AI最终预测"

          echo "================================"


          cat output/prediction.json







      # ==================================================
      # 13. JSON检查
      # ==================================================


      - name:

          检查预测文件

        run:


          python - <<'PY'


          import json


          from pathlib import Path



          file=Path(

              "output/prediction.json"

          )



          assert file.exists()



          data=json.loads(

              file.read_text(

                  encoding="utf-8"

              )

          )


          assert "版本" in data

          assert "预测" in data



          print(

              "JSON检查通过"

          )



          PY








      # ==================================================
      # 14. 保存结果
      # ==================================================


      - name:

          上传预测结果

        uses:

          actions/upload-artifact@v4


        with:


          name:

            marksix-ai-v3.3-result


          path:


            |

              output/prediction.json

              data/marksix_v3.db







      # ==================================================
      # 完成
      # ==================================================


      - name:

          完成

        run:


          echo ""

          echo "================================"

          echo "六合AI V3.3 FINAL运行完成"

          echo "================================"

          echo ""

          echo "数据库 OK"

          echo "API OK"

          echo "预测 OK"

          echo "JSON OK"

          echo ""
