name: 六合AI智能预测 FINAL


on:

  workflow_dispatch:



permissions:

  contents: write



jobs:


  predict:


    runs-on: ubuntu-latest



    steps:



    - name: 拉取代码

      uses: actions/checkout@v4




    - name: Python环境

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"




    - name: 中文环境

      run: |


        echo "LANG=zh_CN.UTF-8" >> $GITHUB_ENV

        echo "LC_ALL=zh_CN.UTF-8" >> $GITHUB_ENV

        echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV





    - name: 安装依赖

      run: |


        python -m pip install --upgrade pip


        if [ -f requirements.txt ];

        then

          pip install -r requirements.txt

        fi





    - name: 运行系统


      env:

        PYTHONPATH: ${{ github.workspace }}

        PYTHONIOENCODING: utf-8


      run:


        python -u main.py





    - name: 中文最终预测


      run: |


        echo "======================"

        echo "       六合AI最终预测"

        echo "======================"


        python - <<'PY'


        import json



        with open(

            "output/prediction.json",

            encoding="utf-8"

        ) as f:


            data=json.load(f)




        for k,v in data["lotteries"].items():


            print()

            print("======================")

            print(

                v.get(

                    "彩种",

                    k

                )

            )

            print("======================")


            if "error" in v:

                print(v["error"])

                continue



            print(

                "状态:",

                v["状态"]["名称"]

            )



            print(

                "特码10码:",

                v["预测"]["特码10码"]

            )



            print(

                "重点3码:",

                v["预测"]["重点3码"]

            )



            print(

                "第一推荐:",

                v["预测"]["第一推荐"]

            )



            print(

                "属性:",

                v["属性"]

            )



        PY




    - name: 保存预测文件


      uses: actions/upload-artifact@v4


      with:


        name: 六合AI预测结果


        path:

          output/prediction.json
