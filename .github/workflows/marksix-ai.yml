name: 智能预测系统 V3.3


on:

  workflow_dispatch:

  schedule:

    - cron: "*/30 * * * *"



jobs:


  predict:


    runs-on: ubuntu-latest



    steps:



      # ==============================
      # 拉取代码
      # ==============================

      - name: 拉取代码

        uses: actions/checkout@v4




      # ==============================
      # Python环境
      # ==============================

      - name: 设置Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      # ==============================
      # 安装依赖
      # ==============================

      - name: 安装依赖

        run: |


          python -m pip install --upgrade pip


          if [ -f requirements.txt ]; then

              pip install -r requirements.txt

          fi




      # ==============================
      # 项目检查
      # ==============================

      - name: 检查项目

        run: |


          echo "=============================="

          echo "检查项目"

          echo "=============================="


          test -f main.py


          mkdir -p data

          mkdir -p output



          python --version





      # ==============================
      # 语法检查
      # ==============================

      - name: Python语法检查

        run: |


          python -m compileall -q .


          echo "语法正常"





      # ==============================
      # 清理旧输出
      # 不删除数据库
      # ==============================

      - name: 清理旧预测

        run: |


          echo "清理旧输出"


          rm -f output/prediction.json





      # ==============================
      # 运行预测
      # ==============================

      - name: 运行六合预测系统

        run: |


          echo "=============================="

          echo "开始运行六合智能预测系统"

          echo "=============================="


          python main.py






      # ==============================
      # 数据库检查
      # ==============================

      - name: 检查数据库文件

        run: |


          echo "=============================="

          echo "数据库文件"

          echo "=============================="


          ls -lah data





      # ==============================
      # 历史检查 (V3.3 单数据库架构)
      # ==============================

      - name: 检查历史数据

        run: |


          python - <<'PY'


          import sqlite3

          from pathlib import Path



          DB_PATH = "data/marksix_v3.db"



          LOTTERIES = {

              "hk": "香港彩",

              "newMacau": "新澳门彩",

              "oldMacau": "老澳门彩"

          }




          print("="*60)

          print("历史数据检查")

          print("="*60)




          if not Path(DB_PATH).exists():

              raise Exception(

                  "数据库不存在: " + DB_PATH

              )



          conn = sqlite3.connect(DB_PATH)



          try:


              for code, name in LOTTERIES.items():



                  try:


                      count = conn.execute(

                          "SELECT COUNT(*) FROM draws WHERE lottery = ?",

                          (code,)

                      ).fetchone()[0]



                  except Exception as e:


                      raise Exception(

                          name + "数据库结构错误: " + str(e)

                      )



                  print(

                      "✅",

                      name,

                      "历史",

                      count,

                      "期"

                  )



                  if count < 30:


                      raise Exception(

                          name + "历史不足30期"

                      )



          finally:


              conn.close()





          print("="*60)

          print("历史检查通过")

          print("="*60)



          PY






      # ==============================
      # 输出文件检查
      # ==============================

      - name: 检查预测文件

        run: |


          echo "检查输出"


          test -f output/prediction.json


          echo "预测文件正常"






      # ==============================
      # 中文显示预测
      # ==============================

      - name: 显示预测结果

        run: |


          python - <<'PY'


          import json



          with open(

              "output/prediction.json",

              encoding="utf-8"

          ) as f:


              data=json.load(f)





          print()

          print("="*70)

          print("六合彩预测结果")

          print("="*70)




          for name,item in data.get("lotteries", {}).items():



              if not item.get("success"):

                  continue



              print()

              print("【"+name+"】")

              print("-"*50)



              print(

                  "历史:",

                  item.get("history_size", 0),

                  "期"

              )



              print(

                  "预测期:",

                  item.get("prediction_issue", "")

              )



              top10 = item.get("top10", [])



              if top10:


                  print()

                  print(

                      "推荐10码:",

                      " ".join(

                          f"{x:02d}"

                          for x in top10

                      )

                  )



              attr=item.get(

                  "attributes",

                  {}

              )



              if attr:


                  print(

                      "生肖:",

                      " ".join(

                          attr.get(

                              "zodiac",

                              {}

                          ).get(

                              "top5",

                              []

                          )

                      )

                  )



                  print(

                      "波色:",

                      " ".join(

                          attr.get(

                              "wave",

                              {}

                          ).get(

                              "rank",

                              []

                          )

                      )

                  )



                  print(

                      "大小:",

                      " ".join(

                          attr.get(

                              "size",

                              {}

                          ).get(

                              "rank",

                              []

                          )

                      )

                  )



                  print(

                      "单双:",

                      " ".join(

                          attr.get(

                              "odd_even",

                              {}

                          ).get(

                              "rank",

                              []

                          )

                      )

                  )



              bt = item.get("backtest", {})



              if bt:


                  print()

                  print("回测:")



                  for k,v in bt.items():


                      print(

                          k+"期:",

                          v.get(

                              "hit_rate",

                              0

                          ),

                          "%"

                      )





          print()

          print("="*70)

          print("预测完成")

          print("="*70)



          