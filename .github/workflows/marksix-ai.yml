name: AI V3.0 自动运行

on:

  workflow_dispatch:

  schedule:

    - cron: "5 * * * *"


permissions:

  contents: write


jobs:

  run:

    runs-on: ubuntu-latest


    steps:


    - name: 下载代码
      uses: actions/checkout@v4



    - name: Python环境
      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: 安装依赖

      run:

        pip install -r requirements.txt



    - name: Python检查

      run:

        python -m compileall .



    - name: 运行系统

      run:

        python main.py



    - name: 保存结果

      run:

        |

        git config user.name github-actions

        git config user.email github-actions@github.com

        git add .

        git commit -m "update prediction" || true

        git push || true
