name: predict

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile
        run: |
          python -m compileall -q .
          echo "Python语法正常"

      - name: Prepare data
        run: |
          mkdir -p data
          mkdir -p output
          echo "目录准备完成"

      - name: Run prediction
        run: |
          python -u main.py

      - name: Check output
        run: |

          echo "=============================="
          echo "检查预测结果"
          echo "=============================="

          test -f output/prediction.json
          test -f output/backtest.json
          test -f output/module_performance.json

          python - <<'PY'

          import json
          import os
          import sys

          files = [
              "output/prediction.json",
              "output/backtest.json",
              "output/module_performance.json",
          ]

          for path in files:

              print(f"检查：{path}")

              if not os.path.isfile(path):
                  print(f"❌ 文件不存在：{path}")
                  sys.exit(1)

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

              except Exception as exc:

                  print(
                      f"❌ JSON解析失败：{exc}"
                  )

                  sys.exit(1)

              if not isinstance(data, dict):

                  print(
                      "❌ JSON顶层必须是object"
                  )

                  sys.exit(1)

              print("✅ JSON正常")

          with open(
              "output/prediction.json",
              "r",
              encoding="utf-8"
          ) as f:

              prediction = json.load(f)

          lotteries = prediction.get(
              "lotteries"
          )

          if not isinstance(
              lotteries,
              dict
          ):
              print(
                  "❌ 缺少lotteries"
              )
              sys.exit(1)

          required = [
              "新澳门彩",
              "老澳门彩",
              "香港彩",
          ]

          for lottery in required:

              if lottery not in lotteries:

                  print(
                      f"❌ 缺少：{lottery}"
                  )

                  sys.exit(1)

              item = lotteries[lottery]

              if not isinstance(
                  item,
                  dict
              ):

                  print(
                      f"❌ {lottery}结构错误"
                  )

                  sys.exit(1)

              if "candidates" not in item:

                  print(
                      f"❌ {lottery}缺少candidates"
                  )

                  sys.exit(1)

              if "latest_issue" not in item:

                  print(
                      f"❌ {lottery}缺少latest_issue"
                  )

                  sys.exit(1)

              if "prediction_issue" not in item:

                  print(
                      f"❌ {lottery}缺少prediction_issue"
                  )

                  sys.exit(1)

              print(
                  f"✅ {lottery}"
              )

              print(
                  f"   最新期：{item['latest_issue']}"
              )

              print(
                  f"   预测期：{item['prediction_issue']}"
              )

          print()
          print(
              "=============================="
          )
          print(
              "预测结果检查通过"
          )
          print(
              "=============================="
          )

          PY

      - name: Show output
        run: |

          echo "=============================="
          echo "最终输出文件"
          echo "=============================="

          ls -lah output/

          echo "=============================="
          echo "prediction.json"
          echo "=============================="

          cat output/prediction.json
