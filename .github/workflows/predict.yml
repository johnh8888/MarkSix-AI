name: MarkSix AI Prediction

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 北京/香港时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # 4. 检查当前开奖 API
      # =====================================================
      #
      # 三个 API：
      #
      # HK
      # type=hk
      #
      # 新澳门
      # type=newMacau
      #
      # 老澳门
      # type=oldMacau
      #
      # 当前网站 SSL 证书过期，
      # 所以这里暂时使用 verify=False。
      #
      # =====================================================

      - name: Inspect Current APIs
        run: |

          python - <<'PY'

          import requests
          import urllib3


          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )


          urls = {

              "HK":
                  "https://marksix6.net/api/lottery_api.php?type=hk",

              "newMacau":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",

              "oldMacau":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",
          }


          def inspect(
              obj,
              path="root",
              depth=0
          ):

              if depth > 3:
                  return


              # -------------------------------------------------
              # dict
              # -------------------------------------------------

              if isinstance(obj, dict):

                  print(
                      f"{path} = dict "
                      f"keys: {list(obj.keys())}"
                  )

                  for key, value in obj.items():

                      inspect(
                          value,
                          f"{path}.{key}",
                          depth + 1
                      )

                  return


              # -------------------------------------------------
              # list
              # -------------------------------------------------

              if isinstance(obj, list):

                  print(
                      f"{path} = list "
                      f"length={len(obj)}"
                  )

                  if obj:

                      inspect(
                          obj[0],
                          f"{path}[0]",
                          depth + 1
                      )

                  return


              # -------------------------------------------------
              # 普通值
              # -------------------------------------------------

              print(
                  f"{path} = "
                  f"{type(obj).__name__}: "
                  f"{str(obj)[:150]}"
              )


          # =====================================================
          # 检查三个接口
          # =====================================================

          for name, url in urls.items():

              print()
              print("=" * 80)
              print(f"API：{name}")
              print(url)
              print("=" * 80)

              try:

                  response = requests.get(

                      url,

                      timeout=30,

                      verify=False,

                      allow_redirects=True
                  )


                  print(
                      "HTTP状态码：",
                      response.status_code
                  )


                  print(
                      "Content-Type：",
                      response.headers.get(
                          "content-type"
                      )
                  )


                  response.raise_for_status()


                  data = response.json()


                  print()
                  print("JSON结构：")


                  inspect(data)


              except Exception as e:

                  print(
                      f"❌ {name} API检查失败：",
                      repr(e)
                  )

          PY


      # =====================================================
      # 5. 检查历史 API
      # =====================================================
      #
      # 目前三个 type API 都只返回当前一期。
      #
      # 所以这里检查可能存在的历史接口。
      #
      # =====================================================

      - name: Inspect History APIs
        run: |

          python - <<'PY'

          import requests
          import json
          import urllib3


          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )


          urls = [

              (
                  "INDEX_API",
                  "https://marksix6.net/index.php?api=1"
              ),

              (
                  "LOTTERY_API",
                  "https://marksix6.net/api/lottery_api.php"
              ),

          ]


          for name, url in urls:

              print()
              print("=" * 80)

              print(
                  f"历史接口测试：{name}"
              )

              print(url)

              print("=" * 80)


              try:

                  response = requests.get(

                      url,

                      timeout=30,

                      verify=False,

                      allow_redirects=True
                  )


                  print(
                      "HTTP状态码：",
                      response.status_code
                  )


                  print(
                      "Content-Type：",
                      response.headers.get(
                          "content-type"
                      )
                  )


                  response.raise_for_status()


                  # -------------------------------------------------
                  # JSON
                  # -------------------------------------------------

                  try:

                      data = response.json()

                      print()
                      print(
                          "JSON返回："
                      )


                      text = json.dumps(

                          data,

                          ensure_ascii=False,

                          indent=2
                      )


                      # 防止日志过大
                      print(
                          text[:30000]
                      )


                      if len(text) > 30000:

                          print()
                          print(
                              "... JSON输出超过30000字符，"
                              "后续内容省略 ..."
                          )


                  except Exception:

                      print()
                      print(
                          "不是标准JSON，"
                          "原始返回："
                      )

                      print(
                          response.text[:30000]
                      )


              except Exception as e:

                  print(
                      f"❌ {name} 请求失败：",
                      repr(e)
                  )

          PY


      # =====================================================
      # 6. 检查项目文件
      # =====================================================

      - name: Check Project
        run: |

          echo "=============================="
          echo "项目文件"
          echo "=============================="

          find . -maxdepth 3 -type f \
            | sort


          echo ""
          echo "=============================="
          echo "Python版本"
          echo "=============================="

          python --version


      # =====================================================
      # 7. Run prediction
      # =====================================================

      - name: Run prediction
        run: |

          echo "=============================="
          echo "开始运行六合彩综合预测系统"
          echo "=============================="

          python main.py


      # =====================================================
      # 8. Show database files
      # =====================================================

      - name: Show Data
        run: |

          echo "=============================="
          echo "Data目录"
          echo "=============================="

          if [ -d data ]; then

            find data -maxdepth 2 -type f \
              -print

          else

            echo "data目录不存在"

          fi


      # =====================================================
      # 9. Show prediction
      # =====================================================

      - name: Show Prediction
        run: |

          echo "=============================="
          echo "预测结果"
          echo "=============================="


          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          else

            echo "⚠️ output/prediction.json 不存在"

          fi


          echo ""
          echo "=============================="
          echo "回测结果"
          echo "=============================="


          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ output/backtest.json 不存在"

          fi


      # =====================================================
      # 10. Git status
      # =====================================================

      - name: Git Status
        run: |

          echo "=============================="
          echo "Git Status"
          echo "=============================="

          git status --short


      # =====================================================
      # 11. Commit results
      # =====================================================

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ output/


          if git diff --cached --quiet; then

            echo "没有新的文件需要提交"

          else

            git commit \
              -m "auto: update prediction"

            git push

          fi
