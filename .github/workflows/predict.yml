name: MarkSix AI Prediction

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 北京/香港时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # 4. 检查三个 API
      # =====================================================
      #
      # 注意：
      # marksix6.net 当前 SSL 证书过期，
      # 所以这里使用 verify=False。
      #
      # 这个步骤不会修改数据库，
      # 只负责检查 API 返回结构。
      #
      # =====================================================

      - name: Inspect API
        run: |

          python - <<'PY'

          import requests

          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )


          urls = {

              "HK":
                  "https://marksix6.net/api/lottery_api.php?type=hk",

              "newMacau":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",

              "oldMacau":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",
          }


          def inspect(
              obj,
              path="root",
              depth=0
          ):

              if depth > 3:
                  return


              # ---------------------------------------------
              # dict
              # ---------------------------------------------

              if isinstance(obj, dict):

                  print(
                      f"{path} = dict "
                      f"keys: {list(obj.keys())}"
                  )

                  for key, value in obj.items():

                      inspect(
                          value,
                          f"{path}.{key}",
                          depth + 1
                      )

                  return


              # ---------------------------------------------
              # list
              # ---------------------------------------------

              if isinstance(obj, list):

                  print(
                      f"{path} = list "
                      f"length={len(obj)}"
                  )

                  if obj:

                      inspect(
                          obj[0],
                          f"{path}[0]",
                          depth + 1
                      )

                  return


              # ---------------------------------------------
              # 普通值
              # ---------------------------------------------

              print(
                  f"{path} = "
                  f"{type(obj).__name__}: "
                  f"{str(obj)[:150]}"
              )


          # =================================================
          # 开始检查
          # =================================================

          for name, url in urls.items():

              print()
              print("=" * 80)
              print(f"API：{name}")
              print(url)
              print("=" * 80)

              try:

                  response = requests.get(
                      url,
                      timeout=30,
                      verify=False,
                      allow_redirects=True
                  )

                  print(
                      f"HTTP状态码："
                      f"{response.status_code}"
                  )

                  print(
                      f"Content-Type："
                      f"{response.headers.get('content-type')}"
                  )


                  response.raise_for_status()


                  data = response.json()


                  print()
                  print("JSON结构：")

                  inspect(data)


              except Exception as e:

                  print(
                      f"❌ {name} API检查失败："
                      f"{repr(e)}"
                  )

          PY


      # =====================================================
      # 5. Run prediction
      # =====================================================

      - name: Run prediction
        run: |

          python main.py


      # =====================================================
      # 6. Show prediction
      # =====================================================

      - name: Show prediction
        run: |

          echo "=============================="
          echo "预测结果"
          echo "=============================="

          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          else

            echo "⚠️ output/prediction.json 不存在"

          fi


          echo "=============================="
          echo "回测结果"
          echo "=============================="

          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ output/backtest.json 不存在"

          fi


      # =====================================================
      # 7. Commit results
      # =====================================================

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ output/


          git diff --cached --quiet || \
            git commit -m "auto: update prediction"


          git push
