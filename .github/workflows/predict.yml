name: MarkSix AI Prediction

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 北京/香港时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prediction
        run: |
          python main.py

      - name: Show prediction
        run: |
          echo "=============================="
          echo "预测结果"
          echo "=============================="

          cat output/predictions.json

          echo "=============================="
          echo "回测结果"
          echo "=============================="

          cat output/backtest.json

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          git diff --cached --quiet || \
            git commit -m "auto: update prediction"

          git push
