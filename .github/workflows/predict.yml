name: 香港六合彩AI智能预测 V3.1

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 22:00 香港/北京时间 = 14:00 UTC
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: marksix-ai-production
  cancel-in-progress: false

jobs:
  predict:
    name: 同步数据 → 质量检查 → 预测 → Walk-Forward → 保存
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ requirements.txt 不存在，使用项目现有依赖"
          fi

      - name: 检查项目结构
        shell: bash
        run: |
          set -e
          test -f main.py || { echo "❌ main.py 不存在"; exit 1; }
          test -d core || { echo "❌ core/ 不存在"; exit 1; }
          find . -maxdepth 3 -type f ! -path "./.git/*" | sort

      - name: Python 语法检查
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          python -m compileall -q main.py core
          echo "✅ Python 语法检查通过"

      - name: 检查核心模块导入
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import importlib

          modules = [
              "core.database",
              "core.data_source",
              "core.features",
              "core.strategies",
              "core.predictor",
              "core.backtest",
              "core.state",
              "core.state_engine",
              "core.wave_model",
              "core.data_quality",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"✅ {name}")

          print("✅ 核心模块导入检查通过")
          PY

      - name: API 健康检查
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          import sys
          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          urls = {
              "香港六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=hk",
              "新澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",
              "老澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",
          }

          success = 0

          for name, url in urls.items():
              print("=" * 70)
              print(f"检查：{name}")
              print(url)

              try:
                  r = requests.get(
                      url,
                      timeout=30,
                      verify=False,
                      allow_redirects=True,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  r.raise_for_status()
                  data = r.json()

                  if not isinstance(data, dict):
                      raise RuntimeError(
                          f"API返回类型异常：{type(data).__name__}"
                      )

                  expect = data.get("expect")
                  numbers = data.get("numbers") or data.get("openCode")

                  if not expect or not numbers:
                      raise RuntimeError(
                          "API返回缺少 expect/numbers："
                          + json.dumps(data, ensure_ascii=False)[:500]
                      )

                  print(f"✅ API正常：期号={expect}")
                  print(f"开奖号码：{numbers}")
                  success += 1

              except Exception as exc:
                  print(f"❌ {name} API检查失败：{exc}")

          print("=" * 70)
          print(f"API健康检查：{success}/{len(urls)}")
          print("=" * 70)

          if success == 0:
              print("❌ 所有实时API均失败，停止本次运行")
              sys.exit(1)

          if success < len(urls):
              print("⚠️ 部分API失败，继续运行，由主程序判断数据新鲜度")
          PY

      # 重要：
      # 不再调用 from core.database import init_database
      #
      # 原 Workflow 在这里假设 database.py 暴露 init_database()，
      # 但当前项目的 database.py 并没有这个公开函数，因此会出现：
      # ImportError: cannot import name 'init_database'
      #
      # 数据库初始化统一交给 main.py / 项目自身数据库逻辑。
      - name: 检查数据库模块接口
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import core.database as db

          print("==========================================")
          print("数据库模块接口检查")
          print("==========================================")

          public = sorted(
              name for name in dir(db)
              if not name.startswith("_")
          )

          print("可用公开接口：")
          for name in public:
              print(" -", name)

          print("✅ core.database 可以正常导入")
          print("ℹ️ 数据库初始化由 main.py / 项目自身逻辑负责")
          PY

      - name: 运行六合彩AI V3.1
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "开始运行六合彩AI智能预测系统 V3.1"
          echo "=========================================="

          python -u main.py

      - name: 检查输出结果
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "输出文件检查"
          echo "=========================================="

          for file in \
            output/prediction.json \
            output/backtest.json
          do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️ $file 不存在"
            fi
          done

          if [ -f output/module_performance.json ]; then
            echo "✅ output/module_performance.json"
          else
            echo "ℹ️ output/module_performance.json 未生成（当前版本可选）"
          fi

      - name: 显示预测结果
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "AI预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then
            python -m json.tool output/prediction.json || cat output/prediction.json
          else
            echo "⚠️ prediction.json 不存在"
          fi

      - name: 显示 Walk-Forward 回测
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Walk-Forward 回测"
          echo "=========================================="

          if [ -f output/backtest.json ]; then
            python -m json.tool output/backtest.json || cat output/backtest.json
          else
            echo "⚠️ backtest.json 不存在"
          fi

      - name: 显示模块表现
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "模块历史表现 / 动态权重"
          echo "=========================================="

          if [ -f output/module_performance.json ]; then
            python -m json.tool output/module_performance.json || cat output/module_performance.json
          else
            echo "ℹ️ module_performance.json 不存在"
          fi

      - name: 检查 Git 状态
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Git 状态"
          echo "=========================================="
          git status --short

      - name: 保存运行结果
        if: success()
        shell: bash
        run: |
          set -e

          # 只有项目确实产生变化才提交
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ 没有新的文件变化需要提交"
            exit 0
          fi

          git commit -m "自动更新：六合彩AI V3.1数据预测与回测"
          git push
