name: 香港六合彩AI智能预测

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 香港/北京时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 拉取项目代码
      # =====================================================

      - name: 拉取项目代码
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # 2. 配置 Python
      # =====================================================

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      # =====================================================
      # 3. 安装依赖
      # =====================================================

      - name: 安装 Python 依赖
        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          else

            echo "⚠️ requirements.txt 不存在"

          fi


      # =====================================================
      # 4. 检查 Python 导入环境
      # =====================================================

      - name: 检查 Python 模块
        run: |

          echo "=========================================="
          echo "检查 Python 模块"
          echo "=========================================="

          python - <<'PY'

          import sys

          print("Python:")
          print(sys.version)

          print()
          print("Python路径:")

          for path in sys.path:
              print(path)

          print()
          print("测试 core 模块...")

          import core

          print("✅ core 导入成功")

          PY


      # =====================================================
      # 5. 检查项目结构
      # =====================================================

      - name: 检查项目结构
        run: |

          echo "=========================================="
          echo "项目文件结构"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort


      # =====================================================
      # 6. 检查开奖 API
      # =====================================================

      - name: 检查开奖 API
        run: |

          python - <<'PY'

          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          urls = {

              "香港六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=hk",

              "新澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",

              "老澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",

          }

          success = 0

          for name, url in urls.items():

              print()
              print("=" * 70)
              print(f"检查：{name}")
              print(url)
              print("=" * 70)

              try:

                  response = requests.get(

                      url,

                      timeout=30,

                      verify=False,

                      allow_redirects=True,

                      headers={
                          "User-Agent":
                              "Mozilla/5.0"
                      }

                  )

                  print(
                      "HTTP状态码：",
                      response.status_code
                  )

                  response.raise_for_status()

                  data = response.json()

                  print(
                      "API请求成功"
                  )

                  print(
                      "返回类型：",
                      type(data).__name__
                  )

                  if isinstance(data, dict):

                      print(
                          "期号：",
                          data.get("expect")
                      )

                      print(
                          "号码：",
                          data.get("numbers")
                          or data.get("openCode")
                      )

                  success += 1

              except Exception as e:

                  print(
                      f"❌ {name} API检查失败：",
                      repr(e)
                  )


          print()
          print("=" * 70)

          print(
              f"API检查完成："
              f"{success}/{len(urls)}"
          )

          print("=" * 70)

          PY


      # =====================================================
      # 7. 检查历史 API
      # =====================================================

      - name: 检查历史数据 API
        run: |

          python - <<'PY'

          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          url = (
              "https://marksix6.net/index.php?api=1"
          )

          print()
          print("=" * 70)
          print("检查历史开奖 API")
          print(url)
          print("=" * 70)

          try:

              response = requests.get(

                  url,

                  timeout=60,

                  verify=False,

                  allow_redirects=True,

                  headers={
                      "User-Agent":
                          "Mozilla/5.0"
                  }

              )

              print(
                  "HTTP状态码：",
                  response.status_code
              )

              response.raise_for_status()

              data = response.json()

              print(
                  "历史 API 请求成功"
              )

              print(
                  "返回类型：",
                  type(data).__name__
              )

              if isinstance(data, dict):

                  lottery_data = data.get(
                      "lottery_data",
                      []
                  )

                  print(
                      "彩种数量：",
                      len(lottery_data)
                  )

          except Exception as e:

              print(
                  "⚠️ 历史 API 检查失败：",
                  repr(e)
              )

          PY


      # =====================================================
      # 8. 数据库初始化检查
      # =====================================================

      - name: 检查数据库模块
        run: |

          python - <<'PY'

          from core.database import init_database

          print(
              "初始化SQLite数据库..."
          )

          init_database()

          print(
              "✅ SQLite数据库初始化成功"
          )

          PY


      # =====================================================
      # 9. 运行 V3.0
      # =====================================================

      - name: 运行六合彩AI V3.0
        env:

          PYTHONPATH: ${{ github.workspace }}

        run: |

          echo "=========================================="
          echo "开始运行六合彩AI智能预测系统 V3.0"
          echo "=========================================="

          python -u main.py


      # =====================================================
      # 10. 显示数据库
      # =====================================================

      - name: 显示开奖数据库
        if: always()
        run: |

          echo "=========================================="
          echo "开奖数据库"
          echo "=========================================="

          if [ -d data ]; then

            find data -maxdepth 2 -type f -print

          else

            echo "data目录不存在"

          fi


      # =====================================================
      # 11. 显示预测结果
      # =====================================================

      - name: 显示预测结果
        if: always()
        run: |

          echo "=========================================="
          echo "AI预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          else

            echo "⚠️ prediction.json 不存在"

          fi


      # =====================================================
      # 12. 显示回测结果
      # =====================================================

      - name: 显示回测结果
        if: always()
        run: |

          echo "=========================================="
          echo "V3.0 Walk-Forward 回测"
          echo "=========================================="

          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ backtest.json 不存在"

          fi


      # =====================================================
      # 13. 显示模块表现
      # =====================================================

      - name: 显示模块表现
        if: always()
        run: |

          echo "=========================================="
          echo "V3.0 模块历史表现"
          echo "=========================================="

          if [ -f output/module_performance.json ]; then

            cat output/module_performance.json

          else

            echo "⚠️ module_performance.json 不存在"

          fi


      # =====================================================
      # 14. Git 状态
      # =====================================================

      - name: 检查 Git 更新
        if: always()
        run: |

          echo "=========================================="
          echo "Git 状态"
          echo "=========================================="

          git status --short


      # =====================================================
      # 15. 自动保存结果
      # =====================================================

      - name: 自动保存预测与回测结果
        if: success()
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ output/


          if git diff --cached --quiet; then

            echo "没有新的文件需要提交"

          else

            git commit \
              -m "自动更新：六合彩AI V3.0预测与回测结果"

            git push

          fi