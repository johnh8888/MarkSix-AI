name: MarkSix AI Prediction

on:
  workflow_dispatch:

  schedule:
    # 每天 UTC 14:00
    # 北京 / 香港时间 22:00
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 4. 检查 Python / 项目
      # =====================================================

      - name: Check Project
        run: |
          echo "=========================================="
          echo "Python版本"
          echo "=========================================="

          python --version

          echo ""
          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort


      # =====================================================
      # 5. 测试 API
      # =====================================================

      - name: Test API
        run: |
          python -c "
          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          urls = {
              'HK': 'https://marksix6.net/api/lottery_api.php?type=hk',
              'newMacau': 'https://marksix6.net/api/lottery_api.php?type=newMacau',
              'oldMacau': 'https://marksix6.net/api/lottery_api.php?type=oldMacau',
              'history': 'https://marksix6.net/index.php?api=1'
          }

          for name, url in urls.items():

              print()
              print('=' * 70)
              print('API:', name)
              print(url)
              print('=' * 70)

              try:

                  response = requests.get(
                      url,
                      timeout=30,
                      verify=False
                  )

                  print('HTTP:', response.status_code)
                  print('Content-Type:', response.headers.get('content-type'))

                  response.raise_for_status()

                  data = response.json()

                  if name == 'history':

                      lottery_data = data.get('lottery_data', [])

                      print(
                          '历史彩种数量:',
                          len(lottery_data)
                      )

                      for item in lottery_data:

                          print(
                              item.get('name'),
                              item.get('code'),
                              item.get('expect')
                          )

                  else:

                      print(
                          '期号:',
                          data.get('expect')
                      )

                      print(
                          '开奖号码:',
                          data.get('openCode')
                      )

              except Exception as e:

                  print(
                      'API错误:',
                      repr(e)
                  )
          "


      # =====================================================
      # 6. 初始化 / 更新 / 预测
      # =====================================================

      - name: Run prediction
        run: |
          echo "=========================================="
          echo "开始运行六合彩综合预测系统"
          echo "=========================================="

          python main.py


      # =====================================================
      # 7. Show database
      # =====================================================

      - name: Show Data
        run: |
          echo "=========================================="
          echo "Data目录"
          echo "=========================================="

          if [ -d data ]; then
            find data -maxdepth 2 -type f -print
          else
            echo "data目录不存在"
          fi


      # =====================================================
      # 8. Show prediction
      # =====================================================

      - name: Show Prediction
        run: |
          echo "=========================================="
          echo "预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then
            cat output/prediction.json
          else
            echo "⚠️ output/prediction.json 不存在"
          fi

          echo ""
          echo "=========================================="
          echo "回测结果"
          echo "=========================================="

          if [ -f output/backtest.json ]; then
            cat output/backtest.json
          else
            echo "⚠️ output/backtest.json 不存在"
          fi


      # =====================================================
      # 9. Git Status
      # =====================================================

      - name: Git Status
        run: |
          echo "=========================================="
          echo "Git Status"
          echo "=========================================="

          git status --short


      # =====================================================
      # 10. Commit results
      # =====================================================

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --cached --quiet; then
            echo "没有新的文件需要提交"
          else
            git commit -m "auto: update prediction"
            git push
          fi
