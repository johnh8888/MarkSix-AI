name: 香港六合彩AI智能预测

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 北京/香港时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 拉取项目代码
      # =====================================================

      - name: 拉取项目代码
        uses: actions/checkout@v4


      # =====================================================
      # 2. 配置 Python
      # =====================================================

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # 3. 安装依赖
      # =====================================================

      - name: 安装 Python 依赖
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # 4. 检查开奖 API
      # =====================================================

      - name: 检查开奖 API
        run: |

          python - <<'PY'

          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          urls = {

              "香港六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=hk",

              "新澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",

              "老澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",

          }

          for name, url in urls.items():

              print()
              print("=" * 70)
              print(f"检查：{name}")
              print(url)
              print("=" * 70)

              try:

                  response = requests.get(
                      url,
                      timeout=30,
                      verify=False,
                      allow_redirects=True
                  )

                  print(
                      "HTTP状态码：",
                      response.status_code
                  )

                  response.raise_for_status()

                  data = response.json()

                  print(
                      "API请求成功"
                  )

                  print(
                      "返回类型：",
                      type(data).__name__
                  )

              except Exception as e:

                  print(
                      f"❌ {name} API检查失败：",
                      repr(e)
                  )

          PY


      # =====================================================
      # 5. 检查历史数据 API
      # =====================================================

      - name: 检查历史数据 API
        run: |

          python - <<'PY'

          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          url = (
              "https://marksix6.net/index.php?api=1"
          )

          print()
          print("=" * 70)
          print("检查历史开奖 API")
          print(url)
          print("=" * 70)

          try:

              response = requests.get(
                  url,
                  timeout=30,
                  verify=False,
                  allow_redirects=True
              )

              print(
                  "HTTP状态码：",
                  response.status_code
              )

              response.raise_for_status()

              data = response.json()

              print(
                  "历史 API 请求成功"
              )

              print(
                  "返回类型：",
                  type(data).__name__
              )

          except Exception as e:

              print(
                  "❌ 历史 API 检查失败：",
                  repr(e)
              )

          PY


      # =====================================================
      # 6. 检查项目文件
      # =====================================================

      - name: 检查项目文件
        run: |

          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=========================================="
          echo "Python版本"
          echo "=========================================="

          python --version


      # =====================================================
      # 7. 运行预测系统
      # =====================================================

      - name: 运行六合彩AI预测系统
        run: |

          echo "=========================================="
          echo "开始运行六合彩AI智能预测系统"
          echo "=========================================="

          python main.py


      # =====================================================
      # 8. 显示数据库
      # =====================================================

      - name: 显示开奖数据库
        run: |

          echo "=========================================="
          echo "开奖数据库"
          echo "=========================================="

          if [ -d data ]; then

            find data -maxdepth 2 -type f -print

          else

            echo "data目录不存在"

          fi


      # =====================================================
      # 9. 显示预测和回测
      # =====================================================

      - name: 显示预测与回测结果
        run: |

          echo "=========================================="
          echo "AI预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          else

            echo "⚠️ prediction.json 不存在"

          fi


          echo ""
          echo "=========================================="
          echo "回测结果"
          echo "=========================================="

          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ backtest.json 不存在"

          fi


      # =====================================================
      # 10. Git 状态
      # =====================================================

      - name: 检查 Git 更新
        run: |

          echo "=========================================="
          echo "Git 状态"
          echo "=========================================="

          git status --short


      # =====================================================
      # 11. 自动保存结果
      # =====================================================

      - name: 自动保存预测与回测结果
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --cached --quiet; then

            echo "没有新的文件需要提交"

          else

            git commit \
              -m "自动更新：六合彩预测与回测结果"

            git push

          fi
