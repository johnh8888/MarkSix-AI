name: MarkSix AI Prediction

on:

  workflow_dispatch:

  schedule:

    # 每天 UTC 14:00
    # 北京 / 香港时间 22:00
    - cron: "0 14 * * *"


permissions:
  contents: write


jobs:

  predict:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # 4. 检查项目文件
      # =====================================================

      - name: Check Project
        run: |

          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          find . -maxdepth 3 -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "Python版本"
          echo "=========================================="

          python --version


      # =====================================================
      # 5. 测试特征模块
      # =====================================================

      - name: Test Features
        run: |

          echo "=========================================="
          echo "测试 features.py"
          echo "=========================================="

          python -m core.features


      # =====================================================
      # 6. 测试策略模块
      # =====================================================

      - name: Test Strategies
        run: |

          echo "=========================================="
          echo "测试 strategies.py"
          echo "=========================================="

          python -m core.strategies


      # =====================================================
      # 7. Run prediction
      # =====================================================

      - name: Run prediction
        run: |

          echo "=========================================="
          echo "开始运行六合彩综合预测系统"
          echo "=========================================="

          python main.py


      # =====================================================
      # 8. Show database files
      # =====================================================

      - name: Show Data
        run: |

          echo "=========================================="
          echo "Data目录"
          echo "=========================================="

          if [ -d data ]; then

            find data -maxdepth 2 -type f \
              -print

          else

            echo "data目录不存在"

          fi


      # =====================================================
      # 9. Show prediction
      # =====================================================

      - name: Show Prediction
        run: |

          echo "=========================================="
          echo "预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          else

            echo "⚠️ output/prediction.json 不存在"

          fi


          echo ""
          echo "=========================================="
          echo "回测结果"
          echo "=========================================="

          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ output/backtest.json 不存在"

          fi


      # =====================================================
      # 10. Git Status
      # =====================================================

      - name: Git Status
        run: |

          echo "=========================================="
          echo "Git Status"
          echo "=========================================="

          git status --short


      # =====================================================
      # 11. Commit results
      # =====================================================

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ output/


          if git diff --cached --quiet; then

            echo "没有新的文件需要提交"

          else

            git commit \
              -m "auto: update prediction"

            git push

          fi          import requests
          import urllib3
          import json


          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )


          API_URLS = {

              "INDEX_API":
                  "https://marksix6.net/index.php?api=1",

              "HK":
                  "https://marksix6.net/api/lottery_api.php?type=hk",

              "newMacau":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",

              "oldMacau":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",

          }


          for name, url in API_URLS.items():

              print()
              print("=" * 80)
              print(f"API测试：{name}")
              print(url)
              print("=" * 80)

              try:

                  response = requests.get(

                      url,

                      timeout=30,

                      verify=False,

                      allow_redirects=True

                  )


                  print(
                      "HTTP状态码：",
                      response.status_code
                  )


                  print(
                      "Content-Type：",
                      response.headers.get(
                          "content-type"
                      )
                  )


                  response.raise_for_status()


                  data = response.json()


                  if name == "INDEX_API":

                      print()

                      print(
                          "服务器时间：",
                          data.get("server_time")
                      )

                      lottery_data = data.get(
                          "lottery_data",
                          []
                      )

                      print(
                          "彩种数量：",
                          len(lottery_data)
                      )


                      for item in lottery_data:

                          print()

                          print(
                              "彩种：",
                              item.get("name")
                          )

                          print(
                              "代码：",
                              item.get("code")
                          )

                          print(
                              "最新期：",
                              item.get("expect")
                          )

                          print(
                              "历史数量：",
                              len(
                                  item.get(
                                      "history",
                                      []
                                  )
                              )
                          )

                          print(
                              "最新开奖号码：",
                              item.get("openCode")
                          )


                  else:

                      print()

                      print(
                          "期号：",
                          data.get("expect")
                      )

                      print(
                          "开奖号码：",
                          data.get("openCode")
                      )

                      print(
                          "开奖时间：",
                          data.get("openTime")
                      )

                      print(
                          "numbers：",
                          data.get("numbers")
                      )


              except Exception as e:

                  print(
                      f"❌ {name} API失败：",
                      repr(e)
                  )

          PY


      # =====================================================
      # 5. 检查历史数据接口
      # =====================================================

      - name: Check History Data
        run: |

          python - <<'PY'

          import requests
          import urllib3


          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )


          url = (
              "https://marksix6.net/"
              "index.php?api=1"
          )


          print("=" * 80)
          print("检查历史开奖数据")
          print("=" * 80)


          response = requests.get(

              url,

              timeout=30,

              verify=False,

              allow_redirects=True

          )


          response.raise_for_status()


          data = response.json()


          lottery_data = data.get(
              "lottery_data",
              []
          )


          if not lottery_data:

              raise RuntimeError(
                  "INDEX_API 没有返回 lottery_data"
              )


          for item in lottery_data:

              name = item.get(
                  "name",
                  "未知彩种"
              )

              code = item.get(
                  "code",
                  ""
              )

              history = item.get(
                  "history",
                  []
              )


              print()

              print(
                  f"彩种：{name}"
              )

              print(
                  f"代码：{code}"
              )

              print(
                  f"历史期数：{len(history)}"
              )


              if history:

                  print(
                      "最新：",
                      history[0]
                  )

                  if len(history) > 1:

                      print(
                          "第二期：",
                          history[1]
                      )


              if len(history) < 100:

                  print(
                      "⚠️ 历史数据少于100期"
                  )

              else:

                  print(
                      "✅ 历史数据满足预测要求"
                  )


          print()

          print("=" * 80)
          print("历史接口检查完成")
          print("=" * 80)

          PY


      # =====================================================
      # 6. 检查项目文件
      # =====================================================

      - name: Check Project
        run: |

          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          find . -maxdepth 3 -type f \
            | sort


          echo ""

          echo "=========================================="
          echo "Python版本"
          echo "=========================================="

          python --version


      # =====================================================
      # 7. 初始化 / 检查目录
      # =====================================================

      - name: Prepare Directories
        run: |

          mkdir -p data
          mkdir -p output


          echo "=========================================="
          echo "Data目录"
          echo "=========================================="

          ls -lah data || true


          echo ""

          echo "=========================================="
          echo "Output目录"
          echo "=========================================="

          ls -lah output || true


      # =====================================================
      # 8. Run prediction
      # =====================================================

      - name: Run prediction
        run: |

          echo "=========================================="
          echo "开始运行六合彩综合预测系统"
          echo "=========================================="

          python main.py


      # =====================================================
      # 9. Show database
      # =====================================================

      - name: Show Data
        run: |

          echo "=========================================="
          echo "数据库 / 数据文件"
          echo "=========================================="

          if [ -d data ]; then

            find data \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

          else

            echo "data目录不存在"

          fi


      # =====================================================
      # 10. Show prediction
      # =====================================================

      - name: Show Prediction
        run: |

          echo "=========================================="
          echo "预测结果"
          echo "=========================================="


          if [ -f output/prediction.json ]; then

            cat output/prediction.json

          elif [ -f output/predictions.json ]; then

            cat output/predictions.json

          else

            echo "⚠️ 没有找到预测文件"

          fi


          echo ""

          echo "=========================================="
          echo "回测结果"
          echo "=========================================="


          if [ -f output/backtest.json ]; then

            cat output/backtest.json

          else

            echo "⚠️ output/backtest.json 不存在"

          fi


      # =====================================================
      # 11. Git Status
      # =====================================================

      - name: Git Status
        run: |

          echo "=========================================="
          echo "Git Status"
          echo "=========================================="

          git status --short


      # =====================================================
      # 12. Commit results
      # =====================================================

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ output/


          if git diff --cached --quiet; then

            echo "没有新的文件需要提交"

          else

            git commit \
              -m "auto: update prediction"

            git push

          fi
