name: 香港六合彩AI智能预测 V3.1

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 22:00 香港/北京时间 = 14:00 UTC
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: marksix-ai-production
  cancel-in-progress: false

jobs:
  predict:
    name: 同步数据 → 质量检查 → 预测 → Walk-Forward → 保存
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # =====================================================
      # 1. 拉取代码
      # =====================================================
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # 2. Python
      # =====================================================
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # 3. 安装依赖
      # =====================================================
      - name: 安装依赖
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ requirements.txt 不存在，使用 Python 标准库运行"
          fi

      # =====================================================
      # 4. 项目结构检查
      # =====================================================
      - name: 检查项目结构
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "项目结构"
          echo "=========================================="

          test -f main.py || {
            echo "❌ main.py 不存在"
            exit 1
          }

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort

      # =====================================================
      # 5. Python 编译检查
      # =====================================================
      - name: Python 语法检查
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e

          python -m compileall -q \
            main.py \
            core \
            2>/dev/null || {
              echo "❌ Python 编译检查失败"
              exit 1
            }

          echo "✅ Python 语法检查通过"

      # =====================================================
      # 6. API 健康检查
      #
      # 这里只做“健康检查”，不负责写数据库。
      # 真正的数据同步由 main.py / data_source.py 完成。
      #
      # 注意：
      # marksix6.net 当前存在过期证书问题。
      # 这里只允许该数据源使用 verify=False，
      # 不改变整个项目的 HTTPS 默认行为。
      # =====================================================
      - name: API 健康检查
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import sys
          import requests
          import urllib3

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          urls = {
              "香港六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=hk",
              "新澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=newMacau",
              "老澳门六合彩":
                  "https://marksix6.net/api/lottery_api.php?type=oldMacau",
          }

          success = 0

          for name, url in urls.items():
              print()
              print("=" * 70)
              print(f"检查：{name}")
              print(url)
              print("=" * 70)

              try:
                  r = requests.get(
                      url,
                      timeout=30,
                      verify=False,
                      allow_redirects=True,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  r.raise_for_status()

                  data = r.json()

                  if not isinstance(data, dict):
                      raise RuntimeError(
                          f"API返回类型异常：{type(data).__name__}"
                      )

                  expect = data.get("expect")
                  numbers = data.get("numbers") or data.get("openCode")

                  if not expect or not numbers:
                      raise RuntimeError(
                          f"API返回缺少 expect/numbers：{json.dumps(data, ensure_ascii=False)[:500]}"
                      )

                  print(f"✅ API正常：期号={expect}")
                  print(f"开奖号码：{numbers}")
                  success += 1

              except Exception as exc:
                  print(f"❌ {name} API检查失败：{exc}")

          print()
          print("=" * 70)
          print(f"API健康检查：{success}/{len(urls)}")
          print("=" * 70)

          # API 全部失败时停止，避免用完全未知状态的数据生成新预测。
          if success == 0:
              print("❌ 所有实时API均失败，停止本次运行")
              sys.exit(1)

          # 允许部分API失败；main.py 会继续执行其自身的数据质量判断。
          if success < len(urls):
              print("⚠️ 部分API失败，本次运行继续，由主程序进行数据新鲜度判断")
          PY

      # =====================================================
      # 7. 数据库初始化
      # =====================================================
      - name: 初始化数据库
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e

          python - <<'PY'
          from core.database import init_database

          print("初始化 SQLite 数据库...")
          init_database()
          print("✅ SQLite 数据库初始化成功")
          PY

      # =====================================================
      # 8. 运行完整生产流程
      #
      # main.py 必须负责：
      #   ① 历史同步
      #   ② 实时同步
      #   ③ 数据质量
      #   ④ 状态识别
      #   ⑤ 动态预测
      #   ⑥ Walk-Forward
      #   ⑦ 模块表现
      #   ⑧ 保存结果
      # =====================================================
      - name: 运行六合彩AI V3.1
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "开始运行六合彩AI智能预测系统 V3.1"
          echo "=========================================="

          python -u main.py

      # =====================================================
      # 9. 结果完整性检查
      # =====================================================
      - name: 检查输出结果
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "输出文件检查"
          echo "=========================================="

          required=(
            "output/prediction.json"
            "output/backtest.json"
            "output/module_performance.json"
          )

          missing=0

          for file in "${required[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ 缺少 $file"
              missing=1
            fi
          done

          if [ -d data ]; then
            echo
            echo "数据库文件："
            find data -maxdepth 2 -type f -print
          fi

          # 如果主程序本身成功但核心结果缺失，仍然判定本次任务失败。
          if [ "${{ job.status }}" = "success" ] && [ "$missing" -ne 0 ]; then
            echo "❌ 核心输出不完整"
            exit 1
          fi

      # =====================================================
      # 10. 显示预测
      # =====================================================
      - name: 显示预测结果
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "AI预测结果"
          echo "=========================================="

          if [ -f output/prediction.json ]; then
            python -m json.tool output/prediction.json || cat output/prediction.json
          else
            echo "⚠️ prediction.json 不存在"
          fi

      # =====================================================
      # 11. 显示 Walk-Forward
      # =====================================================
      - name: 显示回测结果
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Walk-Forward 回测"
          echo "=========================================="

          if [ -f output/backtest.json ]; then
            python -m json.tool output/backtest.json || cat output/backtest.json
          else
            echo "⚠️ backtest.json 不存在"
          fi

      # =====================================================
      # 12. 显示模块表现
      # =====================================================
      - name: 显示模块表现
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "模块历史表现 / 动态权重"
          echo "=========================================="

          if [ -f output/module_performance.json ]; then
            python -m json.tool output/module_performance.json || cat output/module_performance.json
          else
            echo "⚠️ module_performance.json 不存在"
          fi

      # =====================================================
      # 13. Git 状态
      # =====================================================
      - name: 检查 Git 状态
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Git 状态"
          echo "=========================================="

          git status --short

      # =====================================================
      # 14. 持久化数据库、预测、回测、模块表现
      #
      # 注意：
      # 只有 main.py 成功完成后才提交。
      # 失败运行不会把半成品结果推回仓库。
      # =====================================================
      - name: 保存运行结果
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --cached --quiet; then
            echo "ℹ️ 没有新的数据库或输出结果需要提交"
            exit 0
          fi

          git commit \
            -m "自动更新：六合彩AI V3.1数据预测与回测"

          git push
